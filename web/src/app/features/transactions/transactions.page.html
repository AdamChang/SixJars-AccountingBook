<div class="toolbar">
  <app-month-nav [month]="month()" (monthChange)="changeMonth($event)" />
  <mat-form-field class="tag-field" subscriptSizing="dynamic">
    <!-- mat-select 把 null 視為未選取、不顯示「全部標籤」選項的文字，所以用 placeholder 補上 -->
    <mat-select class="tag-filter" aria-label="標籤篩選" placeholder="全部標籤" [value]="tagId()" (valueChange)="changeTag($event)">
      <mat-option [value]="null">全部標籤</mat-option>
      @for (tag of tagOptions(); track tag.id) {
        <mat-option [value]="tag.id">{{ tag.name }}{{ tag.archivedAt ? '（已封存）' : '' }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
@for (book of currentBookAsList(); track book.id) {
  @if (noActiveAccount()) {
    <p class="no-accounts ledger-sheet">
      這本帳本還沒有可用的帳戶，記帳前請先新增帳戶。
      <a [routerLink]="['/books', book.id, 'settings']" [queryParams]="{ tab: 'accounts' }">前往設定</a>
    </p>
  }
  <section class="form-section ledger-sheet">
    <app-transaction-form [book]="book" (saved)="onSaved()" />
  </section>
  <app-transaction-list class="ledger-sheet"
    [transactions]="transactions()"
    [book]="book"
    [filtered]="hasFilter()"
    (edit)="edit(book, $event)"
    (remove)="remove($event)" />
}
