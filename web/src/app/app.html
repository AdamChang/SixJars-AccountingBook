@if (loading.visible()) {
  <mat-progress-bar class="progress" mode="indeterminate" />
}
@if (session.me(); as me) {
  <mat-toolbar class="app-bar">
    @if (currentBook.book(); as book) {
      <!-- Q23：帳本名稱是選單，切換帳本與「新增帳本…」 -->
      <button mat-button type="button" class="book-name" [matMenuTriggerFor]="bookMenu">{{ book.name }} ▾</button>
      <mat-menu #bookMenu="matMenu">
        @for (item of me.books; track item.id) {
          <a mat-menu-item class="book-item" [routerLink]="['/books', item.id, 'transactions']"
             [attr.aria-current]="item.id === book.id ? 'true' : null">{{ item.name }}</a>
        }
        @if (me.canCreateBooks) {
          <mat-divider />
          <button mat-menu-item type="button" class="create-book" [disabled]="me.remainingBookQuota === 0"
                  (click)="bookCreation.start()">新增帳本…</button>
          @if (me.remainingBookQuota === 0) {
            <!-- 5 與後端 CreateBook.MaxOwnedBooks 相同（spec Q15 的文案）；後端改上限時一起改 -->
            <p class="quota-hint">已達 5 本上限</p>
          }
        }
      </mat-menu>
      <nav class="nav">
        <a mat-button [routerLink]="['/books', book.id, 'transactions']" queryParamsHandling="preserve"
           routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="activeOptions">記帳</a>
        <a mat-button [routerLink]="['/books', book.id, 'summary']" queryParamsHandling="preserve"
           routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="activeOptions">總覽</a>
        <a mat-button [routerLink]="['/books', book.id, 'planned-expenses']" queryParamsHandling="preserve"
           routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="activeOptions">預定支出</a>
        <a mat-button [routerLink]="['/books', book.id, 'budgets']" queryParamsHandling="preserve"
           routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="activeOptions">預算</a>
        <!-- 月份參數對設定頁沒有意義，不保留 query params -->
        <a mat-button [routerLink]="['/books', book.id, 'settings']"
           routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="activeOptions">設定</a>
      </nav>
    }
    <span class="spacer"></span>
    <span class="email">{{ me.email }}</span>
    <button mat-button type="button" (click)="session.logout()">登出</button>
  </mat-toolbar>
}
<main class="page">
  <router-outlet />
</main>
